<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Lobby Scanner</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">LS</div>
            <div>
                <div class="lol-panel__title">Lobby Scanner</div>
                <div class="lol-panel__subtitle">Player rank &amp; win rate inspector</div>
            </div>
        </div>
    </div>

    <sdpi-item label="Player Slot">
        <sdpi-select setting="slot" placeholder="Select a slot">
            <optgroup label="Allies">
                <option value="1">Ally 1 (Top)</option>
                <option value="2">Ally 2 (Jungle)</option>
                <option value="3">Ally 3 (Mid)</option>
                <option value="4">Ally 4 (Bot)</option>
                <option value="5">Ally 5 (Support)</option>
            </optgroup>
            <optgroup label="Enemies">
                <option value="6">Enemy 1 (Top)</option>
                <option value="7">Enemy 2 (Jungle)</option>
                <option value="8">Enemy 3 (Mid)</option>
                <option value="9">Enemy 4 (Bot)</option>
                <option value="10">Enemy 5 (Support)</option>
            </optgroup>
        </sdpi-select>
    </sdpi-item>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial rotate</span>
            <span class="ctrl-row__val">Cycle through all 10 players</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key / Press</span>
            <span class="ctrl-row__val">Refresh current player's stats</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Tip</span>
            <span class="ctrl-row__val">Add multiple keys, one per player slot</span>
        </div>
    </div>

    <div class="lol-footer">Lolalytics &middot; League Client API</div>
</body>
</html>
