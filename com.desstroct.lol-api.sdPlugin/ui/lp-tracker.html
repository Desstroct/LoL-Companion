<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>LP Tracker</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">LP</div>
            <div>
                <div class="lol-panel__title">LP Tracker</div>
                <div class="lol-panel__subtitle">Rank, LP &amp; session delta</div>
            </div>
        </div>
    </div>

    <sdpi-item label="Default Queue">
        <sdpi-select setting="queue">
            <option value="solo">Solo/Duo</option>
            <option value="flex">Flex</option>
            <option value="tft">TFT</option>
            <option value="tft_duo">TFT Double Up</option>
        </sdpi-select>
    </sdpi-item>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key / Rotate</span>
            <span class="ctrl-row__val">Cycle queues: Solo &harr; Flex &harr; TFT</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Green delta</span>
            <span class="ctrl-row__val">LP gained this session</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Red delta</span>
            <span class="ctrl-row__val">LP lost this session</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Session reset</span>
            <span class="ctrl-row__val">Remove and re-add the action to reset</span>
        </div>
    </div>

    <div class="lol-footer">League Client API</div>
</body>
</html>
