<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>CS Tracker</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Info">
        <details>
            <summary>How it works</summary>
            <p style="font-size: 11px; color: #999; padding: 8px;">
                Compares your CS to the enemy laner in real-time.<br><br>
                Shows CS delta, gold difference, and a verdict (AHEAD / LEADING / EVEN / DEFICIT / BEHIND).<br><br>
                Auto-detects your lane position. Requires an active game.
            </p>
        </details>
    </sdpi-item>
</body>
</html>
