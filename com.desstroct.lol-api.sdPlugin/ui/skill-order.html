<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Skill Order</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">SO</div>
            <div>
                <div class="lol-panel__title">Skill Order</div>
                <div class="lol-panel__subtitle">Optimal skill max &amp; level priority</div>
            </div>
        </div>
    </div>

    <sdpi-item label="Your Role">
        <sdpi-select setting="role">
            <option value="auto">Auto (detect from lobby)</option>
            <option value="top">Top</option>
            <option value="jungle">Jungle</option>
            <option value="middle">Mid</option>
            <option value="bottom">Bot (ADC)</option>
            <option value="utility">Support</option>
        </sdpi-select>
    </sdpi-item>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key press</span>
            <span class="ctrl-row__val">Toggle priority view &harr; level-by-level grid</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial rotate</span>
            <span class="ctrl-row__val">Switch Most Common &harr; Highest WR order</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial press</span>
            <span class="ctrl-row__val">Toggle detail view</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Highlight</span>
            <span class="ctrl-row__val">Next skill to level at your current level</span>
        </div>
    </div>

    <div class="lol-footer">Lolalytics &middot; League Client API</div>
</body>
</html>
