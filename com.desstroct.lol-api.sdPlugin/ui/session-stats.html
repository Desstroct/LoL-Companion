<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Session Stats</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">SS</div>
            <div>
                <div class="lol-panel__title">Session Stats</div>
                <div class="lol-panel__subtitle">W/L record, streaks &amp; LP delta</div>
            </div>
        </div>
    </div>

    <sdpi-item label="Default Queue">
        <sdpi-select setting="queue">
            <option value="solo">Solo/Duo</option>
            <option value="flex">Flex</option>
        </sdpi-select>
    </sdpi-item>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial rotate</span>
            <span class="ctrl-row__val">Switch Solo/Duo &harr; Flex queue</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key / Press</span>
            <span class="ctrl-row__val">Reset the current session</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Green streak</span>
            <span class="ctrl-row__val">Win streak in progress</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Red streak</span>
            <span class="ctrl-row__val">Loss streak in progress</span>
        </div>
    </div>

    <div class="lol-footer">League Client API &middot; match history</div>
</body>
</html>
