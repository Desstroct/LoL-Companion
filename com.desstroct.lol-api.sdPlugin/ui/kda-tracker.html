<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>KDA Tracker</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">KD</div>
            <div>
                <div class="lol-panel__title">KDA Tracker</div>
                <div class="lol-panel__subtitle">Live K/D/A, CS &amp; gold</div>
            </div>
        </div>
    </div>

    <div class="ctrl-section">
        <div class="ctrl-section__title">Display</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key</span>
            <span class="ctrl-row__val">K / D / A + KDA ratio</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial</span>
            <span class="ctrl-row__val">Full dashboard: KDA, CS/min, gold</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Green bar</span>
            <span class="ctrl-row__val">KDA &ge; 3.0 &mdash; strong performance</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Red bar</span>
            <span class="ctrl-row__val">KDA &lt; 1.5 &mdash; struggling</span>
        </div>
    </div>

    <div class="lol-footer">Riot Live Client API &middot; 1.5s refresh</div>
</body>
</html>
