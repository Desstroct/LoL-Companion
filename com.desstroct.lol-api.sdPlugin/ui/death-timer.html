<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Death Timer</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        .tips-card { margin: 12px 0 4px; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .tips-card__header { background: #1c1c2e; padding: 6px 12px; font-size: 9px; font-weight: 800; letter-spacing: 1.2px; color: #C89B3C; text-transform: uppercase; }
        .tips-card__body { padding: 8px 12px 6px; background: #1a1a1a; }
        .tips-desc { font-size: 11px; color: #888; margin: 0 0 8px; line-height: 1.5; }
        .tip-row { display: flex; gap: 8px; padding: 2px 0; }
        .tip-row__label { flex-shrink: 0; width: 76px; font-size: 10px; font-weight: 700; color: #C89B3C; opacity: 0.85; }
        .tip-row__text { font-size: 11px; color: #aaa; line-height: 1.4; }
        .tips-card__footer { padding: 5px 12px; font-size: 10px; color: #555; background: #161616; border-top: 1px solid #2e2e2e; }
    </style>
</head>
<body>
    <div class="tips-card">
        <div class="tips-card__header">⚡ Quick Tips</div>
        <div class="tips-card__body">
            <p class="tips-desc">Tracks your respawn timer in real time during a game.</p>
            <div class="tip-row">
                <span class="tip-row__label">Alive</span>
                <span class="tip-row__text">Shows your champion icon and current level</span>
            </div>
            <div class="tip-row">
                <span class="tip-row__label">Dead</span>
                <span class="tip-row__text">Countdown in seconds until respawn</span>
            </div>
            <div class="tip-row">
                <span class="tip-row__label">Red bar</span>
                <span class="tip-row__text">Time remaining (drains while dead)</span>
            </div>
            <div class="tip-row">
                <span class="tip-row__label">Green bar</span>
                <span class="tip-row__text">You are alive</span>
            </div>
        </div>
        <div class="tips-card__footer">📡 Riot Live Client API</div>
    </div>
</body>
</html>
