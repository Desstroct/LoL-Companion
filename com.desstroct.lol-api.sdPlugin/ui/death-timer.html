<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Death Timer</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">DT</div>
            <div>
                <div class="lol-panel__title">Death Timer</div>
                <div class="lol-panel__subtitle">Respawn countdown tracker</div>
            </div>
        </div>
    </div>

    <div class="ctrl-section">
        <div class="ctrl-section__title">Display</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Alive</span>
            <span class="ctrl-row__val">Champion icon + current level</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dead</span>
            <span class="ctrl-row__val">Countdown in seconds until respawn</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Red bar</span>
            <span class="ctrl-row__val">Time remaining (drains while dead)</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Green bar</span>
            <span class="ctrl-row__val">You are alive</span>
        </div>
    </div>

    <div class="lol-footer">Riot Live Client API</div>
</body>
</html>
