<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Best Item</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">BI</div>
            <div>
                <div class="lol-panel__title">Best Item</div>
                <div class="lol-panel__subtitle">Optimal build path advisor</div>
            </div>
        </div>
    </div>

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key</span>
            <span class="ctrl-row__val">Next item to buy &mdash; icon, name, cost</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial rotate</span>
            <span class="ctrl-row__val">Browse full build (slot 0 = starter)</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">BUY NOW!</span>
            <span class="ctrl-row__val">You have enough gold for the next item</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial press</span>
            <span class="ctrl-row__val">Reset to auto-advance mode</span>
        </div>
    </div>

    <div class="lol-footer">Lolalytics &middot; Riot Live Client API</div>
</body>
</html>
