<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Wave Clock</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Info">
        <p style="font-size:11px;color:#999;padding:8px 0;">
            Shows the countdown to the next wave and cannon wave in real-time.<br><br>
            <b>Key press / Dial press:</b> Cycle between Top, Mid, and Bot lane timings.<br>
            <b>Dial rotate:</b> Same lane cycle.<br><br>
            Lane is auto-detected when you are in a game.
        </p>
    </sdpi-item>
</body>
</html>
