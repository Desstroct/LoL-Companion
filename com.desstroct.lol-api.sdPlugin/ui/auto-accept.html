<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Auto Accept</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">AA</div>
            <div>
                <div class="lol-panel__title">Auto Accept</div>
                <div class="lol-panel__subtitle">Ready check auto-accept</div>
            </div>
        </div>
    </div>

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key press</span>
            <span class="ctrl-row__val">Toggle auto-accept ON / OFF</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Green key</span>
            <span class="ctrl-row__val">Auto-accept is active</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Grey key</span>
            <span class="ctrl-row__val">Auto-accept is paused</span>
        </div>
    </div>

    <div class="lol-footer">League Client API</div>
</body>
</html>
