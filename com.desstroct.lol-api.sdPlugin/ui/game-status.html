<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Game Status</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">GS</div>
            <div>
                <div class="lol-panel__title">Game Status</div>
                <div class="lol-panel__subtitle">Client phase monitor</div>
            </div>
        </div>
    </div>

    <sdpi-item label="OP.GG Region">
        <sdpi-select setting="region">
            <option value="euw">EUW</option>
            <option value="eune">EUNE</option>
            <option value="na">NA</option>
            <option value="kr">KR</option>
            <option value="br">BR</option>
            <option value="jp">JP</option>
            <option value="lan">LAN</option>
            <option value="las">LAS</option>
            <option value="oce">OCE</option>
            <option value="tr">TR</option>
            <option value="ru">RU</option>
            <option value="sg">SG</option>
            <option value="ph">PH</option>
            <option value="tw">TW</option>
            <option value="vn">VN</option>
            <option value="th">TH</option>
        </sdpi-select>
    </sdpi-item>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key press</span>
            <span class="ctrl-row__val">Open your OP.GG profile in browser</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Region</span>
            <span class="ctrl-row__val">Select your server for correct OP.GG link</span>
        </div>
    </div>

    <div class="lol-footer">League Client API &middot; 2s refresh</div>
</body>
</html>
