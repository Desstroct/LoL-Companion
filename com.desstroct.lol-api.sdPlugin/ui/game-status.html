<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Game Status</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        .tips-card { margin: 12px 0 4px; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .tips-card__header { background: #1c1c2e; padding: 6px 12px; font-size: 9px; font-weight: 800; letter-spacing: 1.2px; color: #C89B3C; text-transform: uppercase; }
        .tips-card__body { padding: 8px 12px 6px; background: #1a1a1a; }
        .tips-desc { font-size: 11px; color: #888; margin: 0 0 8px; line-height: 1.5; }
        .tip-row { display: flex; gap: 8px; padding: 2px 0; }
        .tip-row__label { flex-shrink: 0; width: 76px; font-size: 10px; font-weight: 700; color: #C89B3C; opacity: 0.85; }
        .tip-row__text { font-size: 11px; color: #aaa; line-height: 1.4; }
        .tips-card__footer { padding: 5px 12px; font-size: 10px; color: #555; background: #161616; border-top: 1px solid #2e2e2e; }
    </style>
</head>
<body>
    <sdpi-item label="OP.GG Region">
        <sdpi-select setting="region">
            <option value="euw">EUW</option>
            <option value="eune">EUNE</option>
            <option value="na">NA</option>
            <option value="kr">KR</option>
            <option value="br">BR</option>
            <option value="jp">JP</option>
            <option value="lan">LAN</option>
            <option value="las">LAS</option>
            <option value="oce">OCE</option>
            <option value="tr">TR</option>
            <option value="ru">RU</option>
            <option value="sg">SG</option>
            <option value="ph">PH</option>
            <option value="tw">TW</option>
            <option value="vn">VN</option>
            <option value="th">TH</option>
        </sdpi-select>
    </sdpi-item>
    <div class="tips-card">
        <div class="tips-card__header">⚡ Quick Tips</div>
        <div class="tips-card__body">
            <p class="tips-desc">Shows the current League client phase: Offline, Lobby, Queue, Champ Select, In Game, etc.</p>
            <div class="tip-row">
                <span class="tip-row__label">Key press</span>
                <span class="tip-row__text">Open your OP.GG profile in browser</span>
            </div>
            <div class="tip-row">
                <span class="tip-row__label">Region</span>
                <span class="tip-row__text">Select your server for correct OP.GG link</span>
            </div>
        </div>
        <div class="tips-card__footer">📡 League Client API · updates every 2s</div>
    </div>
</body>
</html>
