<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Jungle Path</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">JP</div>
            <div>
                <div class="lol-panel__title">Jungle Path</div>
                <div class="lol-panel__subtitle">Optimal clear route advisor</div>
            </div>
        </div>
    </div>

    <sdpi-item label="Map Side">
        <sdpi-select setting="side">
            <option value="auto">Auto-detect</option>
            <option value="blue">Blue Side (bottom)</option>
            <option value="red">Red Side (top)</option>
        </sdpi-select>
    </sdpi-item>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key press</span>
            <span class="ctrl-row__val">Cycle between path variants</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial rotate</span>
            <span class="ctrl-row__val">Scroll camp by camp through the path</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial press</span>
            <span class="ctrl-row__val">Switch path variant</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Coverage</span>
            <span class="ctrl-row__val">60+ junglers with tailored paths</span>
        </div>
    </div>

    <div class="lol-footer">Built-in paths &middot; League Client API</div>
</body>
</html>
