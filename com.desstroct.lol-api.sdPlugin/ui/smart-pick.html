<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Smart Pick</title>
    <link rel="stylesheet" href="common.css" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <div class="lol-panel">
        <div class="lol-panel__header">
            <div class="lol-panel__badge">SP</div>
            <div>
                <div class="lol-panel__title">Smart Pick</div>
                <div class="lol-panel__subtitle">Counter + synergy champion advisor</div>
            </div>
        </div>
    </div>

    <sdpi-item label="Your Role">
        <sdpi-select setting="role">
            <option value="auto">Auto (detect from lobby)</option>
            <option value="top">Top</option>
            <option value="jungle">Jungle</option>
            <option value="middle">Mid</option>
            <option value="bottom">Bot (ADC)</option>
            <option value="utility">Support</option>
        </sdpi-select>
    </sdpi-item>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Controls</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Dial rotate</span>
            <span class="ctrl-row__val">Scroll through ranked suggestions</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">Key / Touch</span>
            <span class="ctrl-row__val">Force refresh recommendations</span>
        </div>
    </div>

    <hr class="lol-sep" />

    <div class="ctrl-section">
        <div class="ctrl-section__title">Tier system</div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">[S] / [A]</span>
            <span class="ctrl-row__val">WR tier: S &ge; 54%, A &ge; 52%, B &ge; 50%</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-row__key">syn +X</span>
            <span class="ctrl-row__val">Ally synergy bonus on top of counter WR</span>
        </div>
    </div>

    <div class="lol-footer">Lolalytics &middot; League Client API</div>
</body>
</html>
